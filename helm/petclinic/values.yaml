image:
  registry: kitofoso
  tag: latest

replicas: 1
healthPath: /actuator/health
probeTimeoutSeconds: 5
resources:
  limits:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 30s
services:
  config-server:
    port: 8888
    env:
      SPRING_CLOUD_CONFIG_SERVER_HEALTH_ENABLED: "false"
  discovery-server:
    port: 8761
    waitFor:
    - host: config-server
      port: 8888
  customers-service:
    port: 8081
    metrics: true
    waitFor:
    - host: config-server
      port: 8888
    - host: discovery-server
      port: 8761 
  visits-service:
    port: 8082
    metrics: true
    waitFor:
    - host: config-server
      port: 8888  
    - host: discovery-server
      port: 8761
  vets-service:
    port: 8083
    metrics: true
    waitFor:
    - host: config-server
      port: 8888    
    - host: discovery-server
      port: 8761
  api-gateway:
    port: 8080
    metrics: true
    waitFor:
    - host: config-server
      port: 8888
    - host: discovery-server
      port: 8761